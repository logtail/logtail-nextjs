name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-format:
    name: Check format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - name: Check format in library
        run: npm run check-format
      - name: Check format in logger example
        run: cd examples/logger && npm ci && npm run check-format
      - name: Check format in rpc-app-router example
        run: cd examples/trpc-app-router && npm ci && npm run check-format

  compatibility:
    name: Test with Next.js ${{ matrix.next }} and React ${{ matrix.react }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # 15.0 is the lower bound of the peer range. The E2E workflow runs Next.js's canary against Better Stack.
        next: ["15.0", "15", "16"]
        react: ["18", "19"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - name: Installing Next.js ${{ matrix.next }} and React ${{ matrix.react }}
        run: npm install --no-save next@${{ matrix.next }} react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }}
      - name: Building library
        run: npm run build
      - name: Running tests
        run: npm test

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The E2E workflow runs the newest Node.js, Next.js and React releases and the Node.js nightly against
        # Better Stack.
        node:
          - 18.x
          - 20.x
          - 22.x
          - 24.x
          - 26.x
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # npm ci fails on a lockfile that drifted from package.json
      - run: npm ci
      - name: Building library
        run: npm run build
      - name: Running tests
        run: npm test
      - name: Type-checking library and tests
        run: npm run typecheck
      - name: Building logger example
        run: cd examples/logger && npm ci && npm run build
      - name: Building rpc-app-router example
        run: cd examples/trpc-app-router && npm ci && npm run build
